name: Backend keep-alive

# Intent: ping /health every 10 minutes to keep Render's free web service from spinning down
# after ~15 min idle. In practice, GitHub Actions' `schedule:` trigger is documented as best-
# effort and observably drifts to 25-40 min gaps between runs at this frequency under GitHub's
# own load — so this does NOT reliably prevent cold starts; occasional 20-50s first-load delays
# after a quiet period are expected and accepted (see README > Known limitations). What this
# workflow does reliably provide is an uptime signal: a failure here still alerts immediately
# via Resend, independent of the backend itself.
# Note: this runs (best-effort) 24/7 and is only "free" GitHub Actions minutes on a public repo.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: curl -fsS "$BACKEND_URL/health"

      - name: Alert on failure (backend down)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: backend health check failed\",\"html\":\"<p>The /health keep-alive ping failed. The Render backend may be down or sleeping unexpectedly.</p>\"}"
