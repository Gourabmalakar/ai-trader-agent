name: Backend keep-alive

# Render's free web service spins down after ~15 min idle. Pinging /health every 10 minutes
# keeps it warm (avoiding cold-start latency before trading ticks) and doubles as an uptime
# check: a failure here alerts immediately via Resend, independent of the backend itself.
# Note: this runs 24/7 and is only "free" GitHub Actions minutes on a public repo; reduce the
# frequency (or drop this workflow) if the repo is private and minutes are metered.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: curl -fsS "$BACKEND_URL/health"

      - name: Alert on failure (backend down)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: backend health check failed\",\"html\":\"<p>The /health keep-alive ping failed. The Render backend may be down or sleeping unexpectedly.</p>\"}"
