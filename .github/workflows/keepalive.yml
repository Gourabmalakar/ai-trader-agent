name: Backend keep-alive

# Scheduling moved to cron-job.org (every ~10 min, GET /health) - GitHub Actions' `schedule:`
# trigger is documented as best-effort and observably drifted to 25-40+ min gaps at this
# frequency, well beyond Render's ~15 min idle-sleep threshold, so it did not reliably prevent
# cold starts. Kept here as a manual/backup trigger and for its failure-alert step.
on:
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: curl -fsS "$BACKEND_URL/health"

      - name: Alert on failure (backend down)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: backend health check failed\",\"html\":\"<p>The /health keep-alive ping failed. The Render backend may be down or sleeping unexpectedly.</p>\"}"
