name: Weekly market outlook

# Fires once a week, Friday at ~15:35 IST (10:05 UTC) market close: generates the weekly
# research note and emails it. Deliberately weekly, not daily, to keep most of Gemini's
# limited free-tier daily quota available for actual trading decisions.
on:
  schedule:
    - cron: '5 10 * * 5'
  workflow_dispatch:

jobs:
  send-weekly-outlook:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly outlook email + research note
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/notify/weekly-outlook" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: weekly outlook failed\",\"html\":\"<p>The scheduled weekly-outlook workflow failed to reach /api/notify/weekly-outlook. Check the GitHub Actions log and Render service status.</p>\"}"
