name: Trading tick

# Scheduling moved to cron-job.org (every 15 min, POST to /api/cron/run with the X-Cron-Secret
# header) - GitHub Actions' `schedule:` trigger is documented as best-effort and, in practice on
# this repo, drifted from a 15-min schedule to 25-40+ min gaps or skipped firing entirely for
# stretches, which is too unreliable for the core trading loop. This workflow is kept as a
# manual/backup trigger (workflow_dispatch) and for its failure-alert backstop step, which still
# fires whenever it IS run manually and the call fails.
on:
  workflow_dispatch:

jobs:
  run-trading-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend trading cycle
        id: trigger
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/cron/run" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      # Backstop alert: fires directly via Resend if the backend call above failed or the
      # backend was unreachable, since a down backend can't email its own failure.
      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: trading tick failed\",\"html\":\"<p>The scheduled trading-tick workflow failed to reach /api/cron/run. Check the GitHub Actions log and Render service status.</p>\"}"
