name: Monthly portfolio review

# Scheduling moved to cron-job.org: calls POST /api/notify/monthly-review daily (or restricted
# to day-of-month 28-31) at ~15:40 IST / 10:10 UTC. The endpoint itself is self-guarded
# (see backend/app/main.py::_is_last_day_of_month) to only actually generate and email the
# review on the last calendar day of the month, so it's safe to call it more often than that -
# no conditional logic needs to live in the scheduler itself. Kept here as a manual/backup
# trigger (workflow_dispatch) and for its failure-alert step.
on:
  workflow_dispatch:

jobs:
  generate-monthly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly research note
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/notify/monthly-review" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: monthly review failed\",\"html\":\"<p>The scheduled monthly-review workflow failed to reach /api/notify/monthly-review. Check the GitHub Actions log and Render service status.</p>\"}"
