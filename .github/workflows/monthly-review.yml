name: Monthly portfolio review

# Fires once on the 1st calendar day of each month at ~15:40 IST (10:10 UTC). If the 1st
# lands on an NSE holiday/weekend the note still generates from the latest available state;
# re-run manually via workflow_dispatch if you want it regenerated on the next trading day.
on:
  schedule:
    - cron: '10 10 1 * *'
  workflow_dispatch:

jobs:
  generate-monthly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monthly research note
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/notify/monthly-review" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: monthly review failed\",\"html\":\"<p>The scheduled monthly-review workflow failed to reach /api/notify/monthly-review. Check the GitHub Actions log and Render service status.</p>\"}"
