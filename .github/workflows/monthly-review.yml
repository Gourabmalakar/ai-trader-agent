name: Monthly portfolio review

# Runs daily at ~15:40 IST (10:10 UTC) on weekdays, but only actually calls the backend on the
# LAST trading day of the calendar month (checked in IST) at market close — a monthly review
# published on the day the month closes, not days later on the 1st of the next month.
on:
  schedule:
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate-monthly-review:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today is the last day of the month (IST)
        id: check
        run: |
          today_month=$(TZ=Asia/Kolkata date +%m)
          tomorrow_month=$(TZ=Asia/Kolkata date -d "+1 day" +%m)
          if [ "$today_month" != "$tomorrow_month" ]; then
            echo "is_last_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_last_day=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger monthly research note
        if: steps.check.outputs.is_last_day == 'true'
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/notify/monthly-review" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: monthly review failed\",\"html\":\"<p>The scheduled monthly-review workflow failed to reach /api/notify/monthly-review. Check the GitHub Actions log and Render service status.</p>\"}"
