name: Daily close report

# Scheduling moved to cron-job.org (~15:35 IST / 10:05 UTC, weekdays, POST to
# /api/notify/daily-summary with the X-Cron-Secret header) - see trading-tick.yml for why.
# Kept here as a manual/backup trigger (workflow_dispatch) and for its failure-alert step.
on:
  workflow_dispatch:

jobs:
  send-daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary email + research note
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "$BACKEND_URL/api/notify/daily-summary" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Alert on failure (backend unreachable or errored)
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          curl -fsS -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\":\"AI Trader Agent <onboarding@resend.dev>\",\"to\":[\"$ALERT_EMAIL_TO\"],\"subject\":\"AI Trader Agent alert: daily summary failed\",\"html\":\"<p>The scheduled daily-close workflow failed to reach /api/notify/daily-summary. Check the GitHub Actions log and Render service status.</p>\"}"
